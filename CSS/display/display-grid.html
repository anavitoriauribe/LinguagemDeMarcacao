<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Grid</title>
    <style>
        .vitrine-livros{
            background-color: aliceblue;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
        }

        .card-produto{
            background-color: rgb(78, 128, 172);
            position: relative;
            padding: 20px;
            border: 1px solid;
         

        }

        .selo-oferta{
            background-color: white;
            /* serve para o span selo-oferta flutuar livremente dentro da div */
            position: absolute;
            top: -10px;
            color: rgb(78, 128, 172);
            right: 12px;
            padding: 2px 10px;
        }
    </style>
</head>
<body>
    <section class="vitrine-livros">
        <div class="card-produto"> A República - Platão</div>
        <div class="card-produto"> O Banquete - Platão</div>
        <div class="card-produto">A ética a Nicomaco - Aristóteles</div>
        <div class="card-produto">As Virtudes Morais- São Tomás de Aquino</div>
        <div class="card-produto">Suma Teológica - São Tomás de Aquino </div>
        <div class="card-produto"><span class="selo-oferta">
            -50% OFF
        </span>De Alma - Aristóteles</div>
      
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Pesquisa de Satisfação</title>
</head>
<body style="background-color: #f0cbd3;">
    <h1> 𑣲⋆ Pesquisa de satisfação</h1>
    <h2 style="color: #aa4761;"> Insira seus dados abaixo: </h2>
    <form action="">
        <label for="nome">
            Nome:
            <br>
        </label>
        <input type="text" 
        id="nome"
        name="nome"
        placeholder="Digite seu nome completo"
        required>
        <br><br>
        <label for="email">
            E-mail:
        </label>
        <br>
        <input type="email"
        id="email"
        name="email"
        placeholder="Digite seu e-mail"
        required>
        <br><br>
        <label for="idade">
            Idade:
            <br>
        <input type="number"
        id="idade" 
        name="idade"
        min="18"
        max="120"
        required>
        </label>
        <br><br>
        <label for="telefone">
            Telefone:
        </label>
        <br>
        <input type="tel" 
        id="telefone"
        pattern="[0-9]{11}"
        placeholder="(00) 00000-0000"
        required>
        <br><br>

<h2 style="color: #aa4761;">Como você nos avalia?</h2>
        <input
    type="radio"
    name="avaliacao"
    id="Ótimo">

    <label for="Ótimo">
    Ótimo
    </label>

    <br>

    <input
    type="radio"
    name="avaliacao"
    id="Bom">

    <label for="Bom">
    Bom
    </label>

    <br>

    <input
    type="radio"
    name="avaliacao"
    id="Regular">

    <label for="Regular">
    Regular
    </label>

    <br>

    <input
    type="radio"
    name="avaliacao"
    id="Ruim">

    <label for="Ruim">
    Ruim
    </label>
<br><br>

<h2 style="color: #aa4761;">Marque todos os serviços que você utilizou recentemente:</h2>

<input type="checkbox" id="Atendimento">
<label for="Atendimento">Atendimento</label>

<br>

<input type="checkbox" id="Suporte">
<label for="Suporte">Suporte</label>

<br>

<input type="checkbox" id="Treinamento">
<label for="Treinamento">Treinamento</label>

<br>

<input type="checkbox" id="Consultoria">
<label for="Consultoria">Consultoria</label>

<br><br>

<h2 style="color: #aa4761;">Selecione a unidade de atendimento:</h2>
<select>

    <option>
        São Paulo
    </option>

    <option>
        Rio de Janeiro
    </option>

    <option>
        Minas Gerais
    </option>

</select>

    <br><br>
        <button type="submit" style="color: #aa4761;">
            Cadastrar
        </button>
</body>
</html>

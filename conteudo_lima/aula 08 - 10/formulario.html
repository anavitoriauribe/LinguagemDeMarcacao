<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fomulário HTML</title>
</head>
<body style="background-color: rgba(230, 224, 214, 0.644)">
    <h1>Cadastro de clientes</h1>
    <form action="">
        <label for="nome">
            Nome:
            <br>
        </label>
        <input type="text" 
        id="nome"
        name="nome"
        placeholder="Digite seu nome completo">
        <br><br>
        <label for="email">
            E-mail:
        </label>
        <br>
        <input type="email"
        id="email"
        name="email"
        placeholder="Digite seu e-mail">
        <br><br>
        <label for="idade">
            Idade:
            <br>
        <input type="number"
        id="idade" 
        name="idade"
        min="18"
        max="120"
        required>
        </label>
        <br><br>
        <label for="telefone">
            Telefone:
        </label>
        <br>
        <input type="tel" 
        id="telefone"
        pattern="[0-9]{11}"
        placeholder="(00) 00000-0000">
        <br><br>

        <button type="submit">
            Cadastrar
        </button>

    </form>
</body>
</html>
